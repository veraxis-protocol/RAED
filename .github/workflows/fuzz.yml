name: Fuzz Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 0'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
