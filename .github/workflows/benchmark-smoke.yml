name: Benchmark Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'simulator/**'
      - 'raed/**'
      - 'benchmarks/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go run ./cmd/raed scale -agents 10000 -connections 100000 -seed 42
